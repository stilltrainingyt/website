about:
  eyebrow: About
  title: The person still training
  # DRAFT (step 10): for you to edit. The design's intro said AI "and nothing else".
  lede: I am a computer science student working towards a career in AI, as an engineer who understands it all the way down, and learning everything around it as I go.
  paragraphs:
    # DRAFT (step 10): "learn it" became "learn things", as the channel is wider than AI.
    - This channel is how I make myself learn things properly. If I can explain an idea from zero, with the working shown, I know it. If I can’t, the episode isn’t ready.
    # DRAFT (step 10): for you to edit. Names the topics in the order the plan puts them.
    - It is wider than AI. Careers, skills, research and the things I build come first, and I am still exploring new subjects and forming new opinions every week, so history, the world and what is new in tech have shelves here too.
  card:
    head: Reader’s card · no. 001
