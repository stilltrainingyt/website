# The design's about page words, for the design samples.
about:
  eyebrow: About
  title: The person still training
  lede: I am a computer science student who wants to work on AI and nothing else, as an engineer who understands it all the way down.
  paragraphs:
    - This channel is how I make myself learn it properly. If I can explain an idea from zero, with the working shown, I know it. If I can’t, the episode isn’t ready.
    - It is also wider than AI. I am still exploring new subjects and forming new opinions every week, so history, the world and what is new in tech get their own shelves here too.
  card:
    head: Reader’s card · no. 001
    rows:
      - { label: Name, text: "Pratyush, who goes by Kaka" }
      - { label: Studying, text: "BTech CSE (Data Science), Manipal University Jaipur" }
      - { label: Based in, text: "Noida, India" }
      - { label: Building, text: "The Hallucinated Lab, co-founded with a friend" }
      - { label: Clubs, text: "Accelerate (student coordinator), Panacea CCE, WikiClubTech MUJ" }
  rules:
    eyebrow: About · what I hold to
    title: Five rules for the work
    list:
      - AI should be for everyone, not only for people who can pay for it.
      - Run it on the device. Your data should not have to leave it.
      - Running a model should be cheap enough to do every day.
      - A capable model should fit on weak hardware.
      - Build it safely, and build it to last.
